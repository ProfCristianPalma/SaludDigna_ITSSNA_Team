# Salud Digna Omnicanal - perfil por defecto (PostgreSQL)
spring.application.name=omnicanal
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/saluddigna}
spring.datasource.username=${DB_USER:saluddigna}
spring.datasource.password=${DB_PASSWORD:saluddigna}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# Explícito: los controladores devuelven la entidad Tramite (con paciente LAZY);
# sin open-in-view la serialización Jackson fallaría con LazyInitializationException.
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Secreto JWT (demo). En produccion definir JWT_SECRET con al menos 32 caracteres.
# JWT_SECRET=${JWT_SECRET:salud-digna-demo-secret-cambiar-en-produccion}
