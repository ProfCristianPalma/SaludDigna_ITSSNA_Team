services:
  db:
    image: postgres:15-alpine
    container_name: saluddigna-db
    environment:
      POSTGRES_DB: saluddigna
      POSTGRES_USER: saluddigna
      POSTGRES_PASSWORD: saluddigna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saluddigna -d saluddigna"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: saluddigna-backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/saluddigna
      DB_USER: saluddigna
      DB_PASSWORD: saluddigna
      JWT_SECRET: salud-digna-demo-secret-cambiar-en-produccion
      # Hora de México (America/Mexico_City): sin esto el contenedor corre
      # en UTC y "hoy"/"mañana" y la validación de citas pasadas van 6 h
      # adelantadas (a las 18:00 CST ya es mañana en UTC). El JDK trae su
      # propia base de zonas, así que no hace falta tzdata en la imagen.
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Mexico_City
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: saluddigna-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
